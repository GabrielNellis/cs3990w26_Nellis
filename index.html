<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- A head section that includes metadata -->
    <!-- Specifies the character encoding for the HTML document -->
    <meta charset="UTF-8" />
    <!-- Setting the viewport to make your website look good on all devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The folllowing forces Internet Explorer to use the newest rendering engine available on the user’s computer, 
      rather than older compatibility modes. 
      This ensures that your webpage is displayed using the latest standards-compliant engine, improving both performance and design consistency-->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!--Define a description of your web page-->
    <meta name="description" content="CS3990 final assignment" />
    <meta name="author" content="Gabe" />
    <title>Game Quiz</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="Favicons\favicon-96x96.png"
      sizes="96x96"
    />
    
    <link rel="stylesheet" href="./Styles/styles.css" />
  </head>
  <body>
    <h1>Final Project: Game based Quiz</h1>
    <button id="startGame" class="startButton">
      <p>Start GAME!</p>
    </button>
    <!-- this div below is only shown when the game starts -->
     <div id="gameShw" class="game hidden">
      <div class="details"> <!-- just to put game details in -->
        <h2 class="score">Your score: </h2>
        <h2 id="score" class="stars"></h2>
        </br> <!-- need the break in there otherwise score and time are next to each other -->
        <h2 id="timer" class="timer">0</h2> 
        <h3 id="answer" class="answer"></h3>
        </br> <!-- need the break in there otherwise game over and time are next to each other -->
        <h1 id="gameOver" class="gameOver hidden">Game OVER!</h1>
      </div>
      <div id="gameBoard" class="gameBoard">
      </div>
     </div>
    <script type="module" src="./JS/gameshow.js"></script>
  </body>
</html>
